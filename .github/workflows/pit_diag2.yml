name: pit_diag2
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: pit_diag2
jobs:
  opt:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy
      - run: PYTHONPATH=scripts python scripts/pit_diag2.py
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add pit_diag2.json
          git diff --cached --quiet && exit 0
          git commit -m "pit_diag2 $(TZ=Asia/Seoul date +'%m-%d')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
