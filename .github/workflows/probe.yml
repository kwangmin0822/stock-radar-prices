name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py
      - run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add probe.json; git commit -m probe; for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
