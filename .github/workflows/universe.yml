name: universe
on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 0-4"   # Mon-Fri 05:30 KST, before stats (06:00) and the 09:30 check
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/fetch_universe.py
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add universe.json tickers.json us_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "universe $(TZ=Asia/Seoul date +'%m-%d')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
