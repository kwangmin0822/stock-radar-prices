name: debug
on: workflow_dispatch
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/debug.py
      - run: |
          git config user.name price-bot; git config user.email price-bot@users.noreply.github.com
          git add debug.json; git commit -m debug; git pull --rebase -X theirs; git push
