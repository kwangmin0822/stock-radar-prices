name: sec_shares
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: sec_shares
jobs:
  sec:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: data-export, path: exp}
      - uses: actions/checkout@v4
        with: {path: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow
      - run: python main/scripts/fetch_sec_shares.py exp/data/us_universe_shares.parquet exp/data/sec_shares.parquet
      - name: push
        run: |
          cd exp
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add data/sec_shares.parquet data/sec_shares_missing.json
          git commit -qm "sec shares $(TZ=Asia/Seoul date +'%m-%d %H:%M')"
          git push origin data-export
