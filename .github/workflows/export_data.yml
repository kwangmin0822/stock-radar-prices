name: export_data
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: export_data
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pandas pyarrow
      - run: PYTHONPATH=scripts python scripts/export_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: export
          path: export/
          retention-days: 30
      - name: push to data-export branch
        run: |
          ls -la export export/data; du -sh export
          cd export
          git init -q -b data-export
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add -A; git commit -qm "export $(TZ=Asia/Seoul date +'%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data-export
