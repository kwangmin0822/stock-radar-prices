name: stats
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"   # Monday 06:00 KST
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/fetch_stats.py
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && exit 0
          git commit -m "stats $(TZ=Asia/Seoul date +'%m-%d')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
